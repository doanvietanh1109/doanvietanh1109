name: Green GitHub Snake

on:
  workflow_dispatch:
  schedule:
    - cron: "10 0 * * *"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Green Snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: doanvietanh1109
          outputs: |
            dist/snake-green-dark.svg?color_snake=#4ADE80&color_dots=#0D1F16,#14532D,#166534,#22C55E,#86EFAC
            dist/snake-green-light.svg?color_snake=#15803D&color_dots=#F0FDF4,#DCFCE7,#BBF7D0,#4ADE80,#15803D

      - name: Commit animations
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add dist/snake-green-dark.svg dist/snake-green-light.svg

          if ! git diff --cached --quiet; then
            git commit -m "Update green contribution snake"
            git push origin HEAD
          fi
